[project]
name = "rmtrack"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.121.3",
    "httpx==0.28.1",
    "defusedxml==0.7.1",
]

[tool.vercel]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 130
target-version = "py311"
extend-exclude = ["public", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E731",    # short lambdas read fine
    "B008",
    "RUF001",  # accented names in comments and tests are real names
    "RUF002",
    "RUF003",
    "SIM105",
    "B905",    # zip over equal-length lists throughout
    "RUF005",
]

[tool.ruff.lint.per-file-ignores]
"tests/fake.py" = ["E501"]  # canned API payloads

[tool.pytest.ini_options]
testpaths = ["tests"]
